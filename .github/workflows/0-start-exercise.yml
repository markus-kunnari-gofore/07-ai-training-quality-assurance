name: Step 0 # Start Exercise

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write

# Set these variables to have the correct exercise name and module title.
env:
  STEP_1_FILE: ".github/steps/1-step.md"
  MODULE_TITLE: "Code Quality Assurance with Agents"

jobs:
  disable_workflows:
    if: |
      !github.event.repository.is_template
    name: Disable exercise workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Disable all exercise workflows
        run: |
          # Find all workflow files that start with a number (0-9)
          workflows=$(git ls-files | grep -E '^\.github/workflows/[0-9].*\.(yml|yaml)$')
          for workflow in $workflows; do
            workflow_name="$(basename "$workflow")"
            echo "Disabling workflow: $workflow_name"
            gh workflow disable "$workflow_name" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_exercise:
    name: Create exercise issue and update README
    runs-on: ubuntu-latest

    outputs:
      issue-url: ${{ steps.create-issue.outputs.ISSUE_URL }}
      issue-number: ${{ steps.create-issue.outputs.ISSUE_NUMBER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find and replace image URLs in step files and templates
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            // Process step files with ../images/* pattern
            const stepGlobber = await glob.create('.github/steps/*.md');
            const stepFiles = await stepGlobber.glob();

            stepFiles.forEach(file => {
              const content = fs.readFileSync(file, 'utf8');

              // Replace ../images/* links with GitHub blob URLs suffixed with ?raw=true.
              const updatedContent = content.replace(
                /\.\.\/images\/([^\s)"']+)/g,
                'https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/images/$1?raw=true'
              );

              if (content !== updatedContent) {
                fs.writeFileSync(file, updatedContent, 'utf8');
              }
            });

            // Process template files with ../../images/* pattern
            const templatePatterns = [
              '.github/markdown-templates/exercise/*.md', 
              '.github/markdown-templates/readme/*.md'
            ];

            for (const pattern of templatePatterns) {
              const globber = await glob.create(pattern);
              const files = await globber.glob();

              files.forEach(file => {
                const content = fs.readFileSync(file, 'utf8');

                // Replace ../../images/* links with GitHub blob URLs suffixed with ?raw=true.
                const updatedContent = content.replace(
                  /\.\.\/\.\.\/images\/([^\s)"']+)/g,
                  'https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/images/$1?raw=true'
                );

                if (content !== updatedContent) {
                  fs.writeFileSync(file, updatedContent, 'utf8');
                }
              });
            }

      - name: Build welcome message from local template
        id: build-welcome-message
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/exercise/welcome.md
          template-vars: |
            title: ${{ env.MODULE_TITLE }}
            login: ${{ github.actor }}
            intro_message: Learn to orchestrate AI for rapid software development, transitioning from a manual coder to an AI-driven developer.

      - name: Create issue with welcome message
        id: create-issue
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Exercise: ${{ env.MODULE_TITLE }}`,
              body: process.env.ISSUE_BODY
            });
            core.setOutput('ISSUE_URL', issue.html_url);
            core.setOutput('ISSUE_NUMBER', issue.number);
        env:
          ISSUE_BODY: ${{ steps.build-welcome-message.outputs.updated-text }}

      - name: Build welcome message from template
        id: build-new-readme
        uses: skills/action-text-variables@v3
        with:
          template-file: .github/markdown-templates/readme/exercise-started.md
          template-vars: |
            title: ${{ env.MODULE_TITLE }}
            login: ${{ github.actor }}
            issue_url: ${{ steps.create-issue.outputs.ISSUE_URL }}

      - name: Overwrite README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          add: "README.md .github/steps/*.md .github/markdown-templates/exercise/*.md .github/markdown-templates/readme/*.md"
          message: "Start exercise"
          default_author: github_actions

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [create_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.create_exercise.outputs.issue-number }}
      ISSUE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_1_FILE }}
          vars: |
            login: ${{ github.actor }}
            full_repo_name: ${{ github.repository }}

      - name: Enable next step workflow
        run: |
          gh workflow enable "Step 1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
